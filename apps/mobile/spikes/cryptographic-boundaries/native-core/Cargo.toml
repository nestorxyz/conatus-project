[package]
name = "conatus-crypto-boundary-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom"] }
hex-literal = "=1.1.0"
hkdf = "=0.13.0"
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
minicbor = { version = "=2.3.0", features = ["alloc"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
snow = { version = "=0.10.0", default-features = false, features = ["std", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
