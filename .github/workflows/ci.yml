name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run repository quality gates
        run: make ci
      - name: Generate CycloneDX SBOM
        run: make sbom
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: conatus-sbom
          path: artifacts/conatus.cdx.json
          if-no-files-found: error

  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run durable-kernel checks
        run: pnpm check:f02
      - name: Audit production dependencies
        run: pnpm audit --prod

  mac-foundation:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Mac and contract checks
        run: pnpm check:f01
      - name: Run Gateway lifecycle checks
        run: pnpm check:gateway
