[package]
name = "conatus-rust-web-stack-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
futures-util = "0.3.31"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"
tracing = "0.1.41"

[dev-dependencies]
http = "1.3.1"
tokio-tungstenite = "0.27.0"
tracing-subscriber = { version = "0.3.19", features = ["registry"] }
