services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: conatus
      POSTGRES_USER: conatus
      POSTGRES_PASSWORD: ${CONATUS_DB_PASSWORD:?set CONATUS_DB_PASSWORD locally}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conatus -d conatus"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - conatus-postgres:/var/lib/postgresql

volumes:
  conatus-postgres:
